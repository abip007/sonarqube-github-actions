name: SonarQube Analysis

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  SONAR_PROJECT_KEY: sonarqube-github-actions-demo # must match the key created in SonarQube

jobs:
  sonarqube:
    name: Build, Test & Analyze
    # Default: GitHub-hosted runner (SonarQube must be reachable from the internet, e.g. EC2).
    # Using local Docker SonarQube? Create repo variable RUNNER = self-hosted (see README Option B).
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history gives SonarQube accurate blame / new-code data

      - name: Set up Java 17 (required by the Sonar scanner)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Install SonarScanner for .NET
        run: dotnet tool update --global dotnet-sonarscanner

      - name: Restore dependencies
        run: dotnet restore

      - name: SonarQube - begin analysis
        run: >
          dotnet sonarscanner begin
          /k:"${{ env.SONAR_PROJECT_KEY }}"
          /s:"${{ github.workspace }}/SonarQube.Analysis.xml"
          /d:sonar.host.url="${{ secrets.SONAR_HOST_URL }}"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test with coverage
        run: >
          dotnet test --no-build --configuration Release
          --logger trx --results-directory TestResults
          --collect:"XPlat Code Coverage;Format=opencover"

      - name: SonarQube - end analysis (upload report)
        run: dotnet sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
